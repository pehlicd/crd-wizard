name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release-please
        id: release-please
        uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Release Branch
        if: ${{ steps.release-please.outputs.pr != '' }}
        id: checkout-release-branch
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ fromJson(steps.release-please.outputs.pr).headBranchName }}
          fetch-depth: 0

      - name: "Import GPG key"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Amend the PR commit to sign it
        if: ${{ steps.checkout-release-branch.conclusion == 'success' && steps.import-gpg.conclusion == 'success' }}
        run: |-
          git config --global user.name "${{ steps.import-gpg.outputs.name }}"
          git config --global user.email "${{ steps.import-gpg.outputs.email }}"
          git commit --amend --no-edit -S
          git push --force
