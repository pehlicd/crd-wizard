{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "crd-wizard.fullname" . }}
  labels:
    {{- include "crd-wizard.labels" . | nindent 4 }}
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list"]
  # "Extensive" permissions requested.
  # This provides full read access to all resources in all API groups.
{{- if .Values.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "crd-wizard.fullname" . }}
  labels:
    {{- include "crd-wizard.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "crd-wizard.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "crd-wizard.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
